name: Build Trussets Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Sync Capacitor Android
        run: |
          npm install
          npm run android:sync

      - name: Prepare Upload Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'Trussets@BrandOrigin2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'trussets-upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'Trussets@BrandOrigin2026' }}
        run: |
          if [ ! -f android/trussets-upload-key.jks ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/trussets-upload-key.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Trussets, OU=Mobile, O=Brand Origin, L=Hyderabad, ST=Telangana, C=IN"
          fi
          cat > android/keystore.properties <<EOF
          storeFile=trussets-upload-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Signed Release AAB and APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trussets-playstore-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trussets-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
