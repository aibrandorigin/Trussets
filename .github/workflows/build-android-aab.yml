name: Build Trussets Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Sync Capacitor Android
        run: |
          npm install
          npm run android:sync

      - name: Restore Permanent Upload Keystore (No Random Key Generation)
        env:
          CUSTOM_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'Trussets2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'trussets-upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'Trussets2026' }}
        run: |
          if [ -n "$CUSTOM_KEYSTORE_B64" ]; then
            echo "Restoring custom upload keystore from ANDROID_KEYSTORE_BASE64 secret..."
            echo "$CUSTOM_KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > android/app/trussets-upload-key.jks
          elif [ -f android/app/trussets-upload-key.jks.b64 ]; then
            echo "Restoring tracked permanent upload keystore from android/app/trussets-upload-key.jks.b64..."
            tr -d ' \n\r\t' < android/app/trussets-upload-key.jks.b64 | base64 -d > android/app/trussets-upload-key.jks
          fi

          cp -f android/app/trussets-upload-key.jks android/trussets-upload-key.jks

          # Export PEM certificate matching the active keystore for Play Console Upload Key Reset if needed
          keytool -export -rfc \
            -keystore android/app/trussets-upload-key.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -file android/app/upload_certificate.pem

          echo "=== Active Upload Key Certificate Fingerprints ==="
          keytool -list -v \
            -keystore android/app/trussets-upload-key.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" | grep -E "Alias name:|SHA1:|SHA256:"

          printf "storeFile=trussets-upload-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build Signed Release AAB and APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Verify AAB Cryptographic Signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'Trussets2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'trussets-upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'Trussets2026' }}
        run: |
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          if ! jarsigner -verify "$AAB_FILE" | grep -q "jar verified"; then
            echo "Applying explicit jarsigner signature to AAB..."
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore android/app/trussets-upload-key.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB_FILE" "$KEY_ALIAS"
          fi
          jarsigner -verify -verbose -certs "$AAB_FILE" | head -n 30

      - name: Upload Signed Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trussets-playstore-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trussets-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Keystore & Upload Certificate PEM (For Play Console Upload Key Reset)
        uses: actions/upload-artifact@v4
        with:
          name: trussets-upload-keystore-backup
          path: |
            android/app/trussets-upload-key.jks
            android/app/upload_certificate.pem
