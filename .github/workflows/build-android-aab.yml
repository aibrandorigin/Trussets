name: Build Trussets Signed Android AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Sync Capacitor Android
        run: |
          npm install
          npm run android:sync

      - name: Prepare & Verify Upload Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'Trussets2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'trussets-upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'Trussets2026' }}
        run: |
          if [ ! -f android/app/trussets-upload-key.jks ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/trussets-upload-key.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Trussets, OU=Mobile, O=Brand Origin, L=Hyderabad, ST=Telangana, C=IN"
          fi
          cp -f android/app/trussets-upload-key.jks android/trussets-upload-key.jks
          printf "storeFile=trussets-upload-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build Signed Release AAB and APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Verify AAB Cryptographic Signature (and Sign if Needed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'Trussets2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'trussets-upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'Trussets2026' }}
        run: |
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"
          if ! jarsigner -verify "$AAB_FILE" | grep -q "jar verified"; then
            echo "Applying explicit jarsigner signature to AAB..."
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore android/app/trussets-upload-key.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB_FILE" "$KEY_ALIAS"
          fi
          jarsigner -verify -verbose -certs "$AAB_FILE" | head -n 30

      - name: Upload Signed Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trussets-playstore-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trussets-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Keystore & Upload Certificate Backup
        uses: actions/upload-artifact@v4
        with:
          name: trussets-upload-keystore-backup
          path: |
            android/app/trussets-upload-key.jks
            android/app/upload_certificate.pem
