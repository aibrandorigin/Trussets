apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def configuredStorePath = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH') ?: 'trussets-upload-key.jks'
def resolvedStorePassword = (keystoreProperties['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'Trussets2026').toString().trim()
def resolvedKeyAlias = (keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS') ?: 'trussets-upload').toString().trim()
def resolvedKeyPassword = (keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD') ?: 'Trussets2026').toString().trim()

// Resolve keystore file checking both app/ directory and android/ root directory
File resolvedKeystoreFile = file(configuredStorePath)
if (!resolvedKeystoreFile.exists()) {
    File rootCandidate = rootProject.file(configuredStorePath)
    if (rootCandidate.exists()) {
        resolvedKeystoreFile = rootCandidate
    } else if (file("trussets-upload-key.jks").exists()) {
        resolvedKeystoreFile = file("trussets-upload-key.jks")
    } else if (rootProject.file("trussets-upload-key.jks").exists()) {
        resolvedKeystoreFile = rootProject.file("trussets-upload-key.jks")
    }
}

// Guarantee keystore exists so release AAB/APK is NEVER unsigned
if (!resolvedKeystoreFile.exists()) {
    resolvedKeystoreFile = file("trussets-upload-key.jks")
    logger.lifecycle("Generating release upload keystore at: ${resolvedKeystoreFile.absolutePath}")
    def keytoolCmd = [
        'keytool', '-genkeypair', '-v',
        '-storetype', 'PKCS12',
        '-keystore', resolvedKeystoreFile.absolutePath,
        '-alias', resolvedKeyAlias,
        '-keyalg', 'RSA',
        '-keysize', '2048',
        '-validity', '10000',
        '-storepass', resolvedStorePassword,
        '-keypass', resolvedKeyPassword,
        '-dname', 'CN=Trussets, OU=Mobile, O=Brand Origin, L=Hyderabad, ST=Telangana, C=IN'
    ]
    def proc = keytoolCmd.execute()
    proc.waitFor()
}

android {
    namespace = "com.trussets.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.trussets.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            storeFile resolvedKeystoreFile
            storePassword resolvedStorePassword
            keyAlias resolvedKeyAlias
            keyPassword resolvedKeyPassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            // Unconditionally sign release APK and AAB with release signingConfig
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
